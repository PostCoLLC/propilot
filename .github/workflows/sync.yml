name: Sync RPT feed and deploy

# Paste over .github/workflows/sync.yml in PostCoLLC/propilot. This is the live file with
# two changes: the schedule, and accounts.json comes from the ACCOUNTS_JSON secret. Do NOT use "WORKFLOW - paste into .github-workflows-sync.yml.txt"
# yet — that is the private-feed cutover version and takes the wells screen down.

on:
  schedule:
    - cron: '17 9 * * 1'          # Monday 09:17 UTC (4:17 AM Central) - lands before the workday even if GitHub runs it late
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Pull the full 5-year history instead of the 14-day window'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rpt-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify credentials are present
        env:
          RPT_USER: ${{ secrets.RPT_USER }}
          RPT_PASS: ${{ secrets.RPT_PASS }}
        run: |
          if [ -z "$RPT_USER" ] || [ -z "$RPT_PASS" ]; then
            echo "::error::RPT_USER / RPT_PASS secrets are not set. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Credentials present."

      - name: Write accounts.json from the ACCOUNTS_JSON secret
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          # The account map is not kept in the repo (the repo is public). It lives in a secret,
          # is written here for rpt-sync.js, and is never committed or published.
          if [ -z "$ACCOUNTS_JSON" ]; then
            echo "::error::ACCOUNTS_JSON secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$ACCOUNTS_JSON" > accounts.json
          node -e "JSON.parse(require('fs').readFileSync('accounts.json','utf8'))" \
            || { echo "::error::ACCOUNTS_JSON is not valid JSON."; exit 1; }
          echo "accounts.json written from secret."

      - name: Pull RPT data and rebuild feed
        env:
          RPT_USER: ${{ secrets.RPT_USER }}
          RPT_PASS: ${{ secrets.RPT_PASS }}
          RPT_OUT: rpt-feed.json
          RPT_CONC: '24'
          RPT_FULL: ${{ github.event.inputs.full_sweep == 'true' && '1' || '' }}
        run: node rpt-sync.js

      - name: Confirm the feed actually refreshed
        run: |
          node -e "
            const f=require('./rpt-feed.json');
            const ageH=(Date.now()-new Date(f.updated))/3.6e6;
            console.log('feed updated:',f.updated,'| wells:',f.wells.length,'| inventory:',(f.inventory||[]).length);
            if(ageH>2){ console.error('::error::Feed is '+ageH.toFixed(1)+'h old - it was NOT rewritten.'); process.exit(1); }
          "

      - name: Commit the refreshed feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A rpt-feed.json rpt-raw-cache.json.gz
          if git diff --staged --quiet; then
            echo "Feed unchanged; nothing to commit."
          else
            git commit -m "Refresh RPT feed [skip ci]"
            git push
          fi

  deploy:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify the app is actually here
        run: |
          test -f index.html || { echo "::error::index.html missing from the repo root - Pages would deploy an empty site."; exit 1; }
          echo "index.html present ($(wc -c < index.html) bytes)."

      - name: Stage only the files the site should serve
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'rpt-sync.js' \
            --exclude 'accounts.json' \
            --exclude 'raw-records.json' \
            --exclude 'rpt-raw-cache.json.gz' \
            --exclude '*.bat' \
            --exclude '*.yml' \
            --exclude '*.md' \
            --exclude 'Pump shop app design*/'
          echo "Staged:"; ls -la _site
          for f in rpt-sync.js accounts.json; do
            if [ -e "_site/$f" ]; then echo "::error::$f would be published."; exit 1; fi
          done
          test -f _site/index.html    || { echo "::error::index.html did not make it into _site."; exit 1; }
          test -f _site/rpt-feed.json || { echo "::error::rpt-feed.json did not make it into _site."; exit 1; }

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
